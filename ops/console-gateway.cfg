global
    log stdout format raw local0
    maxconn 128

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

frontend public_console
    bind 127.0.0.1:16080
    acl portal_console path_beg /ucconsole/
    use_backend portal_console if portal_console
    default_backend nova_console

backend portal_console
    http-request replace-path ^/ucconsole/(.*)$ /assets/\1
    http-response set-header Cache-Control no-store
    server portal 127.0.0.1:18080 check

backend nova_console
    server novnc 172.29.236.11:6080 check
